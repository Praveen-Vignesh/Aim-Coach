<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aim Trainer</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="crosshair"></div>
    <div id="hud">
      <div class="hud-row"><span class="hud-label">Score</span><span id="hud-score">0</span></div>
      <div class="hud-row"><span class="hud-label">Attempts</span><span id="hud-attempts">0</span></div>
      <div class="hud-row"><span class="hud-label">Accuracy</span><span id="hud-accuracy">0%</span></div>
      <div class="hud-row"><span class="hud-label">Avg time</span><span id="hud-avg-time">0 ms</span></div>
    </div>
    <div id="overlay">
      <div id="overlay-panel">
        <p id="overlay-title">Click to start</p>
        <p id="overlay-hint">Left click to shoot &middot; Esc to pause</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
